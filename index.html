<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
        <h2>Juego de Gato</h2>
    </header>
    <div class="players">
        <div class="player1">
            <p>Jugador 1</p>
            <div class="symbol1"></div>
        </div>
        <div class="player1">
            <p>Jugador 2</p>
            <div class="symbol2"></div>
        </div>
    </div>
    <div id="turn"></div>
    <div id="board">
        <div id="square1"></div>
        <div id="square2"></div>
        <div id="square3"></div>
        <div id="square4"></div>
        <div id="square5"></div>
        <div id="square6"></div>
        <div id="square7"></div>
        <div id="square8"></div>
        <div id="square9"></div>
    </div>
    <footer>
        <div class="buttons">
            <button type="button">Crear Jugador</button>
            <button type="reset">Reiniciar juego</button>
        </div>
        <div class="author"><p>&copy; 2026 Laura Leyva</p>
    </div>
    </footer>

</body>
</html>

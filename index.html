<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
  <div class="content">  
        <header>
            <h1>Tic Tac Toe</h1>
            <h2>Juego de Gato</h2>
        </header>
        <div class="players">
            <div class="player1 player">
                <p>Jugador 1</p>
                <div class="symbol1 symbol"></div>
            </div>
            <div class="player2 player">
                <p>Jugador 2</p>
                <div class="symbol2 symbol"></div>
            </div>
        </div>
        <div class="turn" id="turn"></div>
        <div id="board" class="board">
            <div id="0" class="square"></div>
            <div id="1" class="square"></div>
            <div id="2" class="square"></div>
            <div id="3" class="square"></div>
            <div id="4" class="square"></div>
            <div id="5" class="square"></div>
            <div id="6" class="square"></div>
            <div id="7" class="square"></div>
            <div id="8" class="square"></div>
        </div>
        <footer>
            <div class="buttons">
                <button id="createPlayers" type="button">Crear Jugador</button>
                <button id="reset" type="reset">Reiniciar juego</button>
            </div>
            <div class="author"> <p> &copy; 2026 Laura Leyva</p></div>
        </footer>
    </div>
</body>
</html>
